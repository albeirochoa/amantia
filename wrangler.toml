# Configuración del Worker de Amantia (sitio estático Astro servido vía Static Assets).
# El `name` debe coincidir con el Worker existente para actualizarlo (no crear uno nuevo).
name = "amantia"
compatibility_date = "2025-05-01"

# Dominios personalizados del Worker (apex ya existente + www).
# custom_domain=true le dice a Cloudflare que cree/gestione el binding como dominio propio.
routes = [
  { pattern = "amantia.com.co", custom_domain = true },
  { pattern = "www.amantia.com.co", custom_domain = true },
]

# Worker mínimo: redirige www → apex con 301 (las Page Rules no actúan sobre custom domains del Worker).
main = "worker/index.js"

# Astro compila a HTML/CSS/JS estáticos en ./dist — se sirven como assets a través del Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# El Worker corre primero en cada petición para poder redirigir www.
run_worker_first = true
